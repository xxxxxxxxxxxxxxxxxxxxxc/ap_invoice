name: Build & Deploy SAP CAP (AP_Invoice)

on:
  workflow_dispatch:


permissions:
  contents: write
  actions: read
  security-events: write

concurrency:
  group: ui5-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ./project

      - name: Set wiz cache
        id: wiz_download_cache
        uses: actions/cache@v4
        with:
          path: wizcli
          key: ${{ runner.os }}-download-wizcli-v1

      - name: Download wizcli
        if: steps.wiz_download_cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://wizcli.app.wiz.io/v1/latest/wizcli -o wizcli
          chmod +x wizcli
          ./wizcli version || true

      # --- REINTEGRATO: Autenticazione su Wiz ---
      - name: Wiz auth
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          ./wizcli auth --id "$WIZ_CLIENT_ID" --secret "$WIZ_CLIENT_SECRET"

      # --- REINTEGRATO: Scansione della cartella del progetto ---
      - name: Wiz scan (directory)
        id: wiz_scan
        continue-on-error: true
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          ./wizcli dir scan \
            --path ./project \
            --name "$REPO_NAME" \
            --output wiz-results.sarif,sarif \
            --output wiz-results.json,json
          ls -l wiz-results.* || true

      - name: Upload Wiz JSON report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wiz-results-json
          path: wiz-results.json

      - name: Upload SARIF to GitHub Security (optional)
        if: ${{ vars.GHAS == 'true' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: wiz-results.sarif

      # --- REINTEGRATO: Logica di controllo delle vulnerabilità (Gating) ---
      - name: Wiz gating (prefer policy verdict, fallback to severity)
        env:
          FAIL_LEVEL: ${{ vars.WIZ_FAIL_LEVEL }}
        shell: bash
        run: |
          set -e 
          VERDICT=$(jq -r '
           (.. | objects | .status?.verdict? // empty) as $v
           | if ($v|type=="string") then $v
             else (.. | objects | .verdict? // empty) end
          ' wiz-results.json 2>/dev/null | head -n1 | tr '[:lower:]' '[:upper:]')

          if [ -n "$VERDICT" ]; then
           echo "Wiz policy verdict: $VERDICT"
           if [ "$VERDICT" = "FAILED_BY_POLICY" ] || [ "$VERDICT" = "FAILED" ]; then
             exit 1
           fi
          fi

          LEVEL="${FAIL_LEVEL:-ihighg}"

          rank() {
           case "$1" in
             critical) echo 4 ;;
             high)     echo 3 ;;
             medium)   echo 2 ;;
             low)      echo 1 ;;
             none|"")  echo 0 ;;
             *)        echo 0 ;;
           esac
          }
          THRESHOLD=$(rank "$(echo "$LEVEL" | tr '[:upper:]' '[:lower:]')")

          echo "Wiz threshold: $THRESHOLD (fail on $LEVEL and above)"

          CRIT=$(jq -r '..|objects|.analytics?.vulnerabilities?.criticalCount? // empty' wiz-results.json 2>/dev/null | head -n1)
          HIGH=$(jq -r '..|objects|.analytics?.vulnerabilities?.highCount? // empty' wiz-results.json 2>/dev/null | head -n1)
          MED=$(jq -r '..|objects|.analytics?.vulnerabilities?.mediumCount? // empty' wiz-results.json 2>/dev/null | head -n1)
          LOW=$(jq -r '..|objects|.analytics?.vulnerabilities?.lowCount? // empty' wiz-results.json 2>/dev/null | head -n1)

          echo "Wiz vulnerabilities: critical=$CRIT high=$HIGH medium=$MED low=$LOW"

          if [ -n "$CRIT$HIGH$MED$LOW" ]; then
           CRIT=${CRIT:-0}; HIGH=${HIGH:-0}; MED=${MED:-0}; LOW=${LOW:-0}
           FAIL=0
           if [ $THRESHOLD -le 4 ] && [ $CRIT -gt 0 ]; then 
             echo "Wiz scan failed due to $CRIT critical vulnerabilities at or above the threshold level"
             FAIL=1; 
           fi
           if [ $THRESHOLD -le 3 ] && [ $HIGH -gt 0 ]; then 
             echo "Wiz scan failed due to $HIGH high vulnerabilities at or above the threshold level"
             FAIL=1; 
           fi
           if [ $THRESHOLD -le 2 ] && [ $MED  -gt 0 ]; then 
             echo "Wiz scan failed due to $MED medium vulnerabilities at or above the threshold level"
             FAIL=1; 
           fi
           if [ $THRESHOLD -le 1 ] && [ $LOW  -gt 0 ]; then 
             echo "Wiz scan failed due to $LOW low vulnerabilities at or above the threshold level"
             FAIL=1; 
           fi
           if [ "$FAIL" -eq 1 ] && [ "$THRESHOLD" -gt 0 ]; then
             echo "Wiz scan failed due to vulnerabilities at or above the threshold level"
             exit 1;
           fi
          fi

          get_severities_json() {
            jq -r '
              .. | objects
              | (.severity // .severityLevel // .level)?
              | select(.)' wiz-results.json 2>/dev/null || true
          }
          get_severities_sarif() {
            jq -r '[ .runs[].results[].level ] | .[]?' wiz-results.sarif 2>/dev/null || true
          }
          SEVS="$(get_severities_json)"
          [ -z "$SEVS" ] && SEVS="$(get_severities_sarif)"

          FAIL=0
          while read -r S; do
           [ -z "$S" ] && continue
           L=$(echo "$S" | tr '[:upper:]' '[:lower:]')
           case "$L" in
             critical|crit|error) LVL=4 ;;
             high|warning)        LVL=3 ;;
             medium|moderate)     LVL=2 ;;
             low|note|info)       LVL=1 ;;
             *)                   LVL=0 ;;
           esac
          if [ "$THRESHOLD" -gt 0 ] && [ "$LVL" -ge "$THRESHOLD" ]; then
             echo "Wiz scan failed due to a $S vulnerability at or above the threshold level"
             FAIL=1
             break;
          fi
          done <<< "$SEVS"

          if [ "$THRESHOLD" -gt 0 ] && [ "$FAIL" -eq 1 ]; then
           echo "Wiz scan failed due to vulnerabilities at or above the threshold level"
           echo "the artifacts will be built and deployed, but you should check the report and fix the vulnerabilities as soon as possible"
           exit 0
          fi

  build-and-deploy:
    needs: scan-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION_BUILD }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools (MBT & SAP CDS CLI)
        run: |
          npm install -g mbt
          npm install -g @sap/cds-dk

      - name: Install Project Dependencies
        run: npm install

      - name: Build MTA Archive (Genera il file .mtar)
        run: mbt build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AP_Invoice_MTA
          path: mta_archives/*.mtar
