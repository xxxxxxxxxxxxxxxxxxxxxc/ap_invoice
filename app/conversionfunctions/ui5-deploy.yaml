# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "2.6"
metadata:
  name: conversionfunctions
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: conversionfunctions
        additionalFiles:
          - xs-app.json
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: conversionfunctions
        relativePaths: true
        additionalFiles:
          - xs-app.json
  resources:
    excludes:
      - /test/**
      - /localService/**
